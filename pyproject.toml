[project]
name = "paretoguard"
version = "0.1.0"
description = "Adaptive, reliability-aware routing and chaos evaluation for production LLM and agent systems."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "ParetoGuard contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.8",
    "duckdb>=1.1",
    "polars>=1.9",
    "pyarrow>=17.0",
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "tzdata>=2024.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# OpenAI/Anthropic/Gemini adapters call each provider's REST API directly over
# httpx (see src/paretoguard/providers/), not the official SDKs, so no SDK
# extras are declared for them. `torch` is for the optional PyTorch router
# baseline (paretoguard.routing.torch_router, Phase D) — deliberately not a
# base dependency; `paretoguard.routing` itself never imports torch.
torch = ["torch>=2.4"]

[project.scripts]
paretoguard = "paretoguard.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.12",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paretoguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires real provider API credentials (skipped by default in CI)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["paretoguard"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["paretoguard"]
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "sklearn.*", "torch.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/paretoguard"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true
